name: Build MD DuckLake Replicator

# Builds a standalone Linux x86_64 `etl-replicator` binary (ducklake feature
# only) and publishes it as a release asset so a MotherDuck Flight can download
# and run it against a native MotherDuck database.

on:
  workflow_dispatch:
  push:
    branches:
      - motherduck-minimal

permissions:
  contents: write

jobs:
  build:
    # Build on an older glibc (Ubuntu 22.04 = glibc 2.35) so the binary runs on
    # the Flights Debian base image. ubuntu-latest ships a newer glibc that fails
    # with "GLIBC_2.3x not found" on the Flight.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            clang \
            make \
            cmake \
            build-essential

      - name: Install Rust toolchain
        # Honors rust-toolchain.toml (channel 1.95.0).
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build etl-replicator (ducklake only)
        run: |
          cargo build --release -p etl-replicator \
            --no-default-features --features ducklake
          strip target/release/etl-replicator
          cp target/release/etl-replicator etl-replicator-linux-amd64

      - name: Package binary and build manifest
        env:
          # Recorded into latest.json so a consumer (the MotherDuck Flight
          # resolver) can verify it is pulling exactly this successful build.
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p dist
          cp etl-replicator-linux-amd64 dist/
          cd dist
          gzip -k -9 etl-replicator-linux-amd64
          # SHA256SUMS is the sha256 of the .gz asset that consumers download.
          GZ_SHA=$(sha256sum etl-replicator-linux-amd64.gz | awk '{print $1}')
          sha256sum etl-replicator-linux-amd64.gz > SHA256SUMS
          # latest.json makes "the latest successful build" explicit + traceable.
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg sha "$BUILD_SHA" \
            --argjson run_id "$BUILD_RUN_ID" \
            --arg run_url "$BUILD_RUN_URL" \
            --arg built_at "$BUILT_AT" \
            --arg asset "etl-replicator-linux-amd64.gz" \
            --arg sha256 "$GZ_SHA" \
            '{sha:$sha, run_id:$run_id, run_url:$run_url, built_at:$built_at, asset:$asset, sha256:$sha256}' \
            > latest.json
          echo "--- latest.json ---"; cat latest.json
          echo "--- SHA256SUMS ---"; cat SHA256SUMS
          ls -la

      - name: Publish release
        # Runs only on success (default job flow), so whatever lands in the
        # release is by definition the latest successful build; latest.json
        # records the exact sha / run for traceable, verifiable pulls.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="replicator-md-ducklake"
          # Recreate the release so the tag always points at this build.
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            --title "MotherDuck DuckLake replicator (linux/amd64)" \
            --notes "etl-replicator built with the ducklake feature for native MotherDuck replication. Commit ${GITHUB_SHA}." \
            dist/etl-replicator-linux-amd64 \
            dist/etl-replicator-linux-amd64.gz \
            dist/SHA256SUMS \
            dist/latest.json
